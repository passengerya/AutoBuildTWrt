# 此工作流是为了构建一个immortalwrt固件的安装器 格式为iso 可用于所有的虚拟机 和 物理机
# 所谓安装器就是用来安装用的 iso引导的是一个启动速度极快的debian live系统 跑码后输入命令 ddd 即可调出安装菜单
# 安装时 若是多张硬盘 你可以选择 需要安装的硬盘 此类方法安装的openwrt 安装后是有剩余空间的 更多信息请参考 wukongdaily/img-installer 项目
# 几乎所有linux 都有各自的安装器 唯独openwrt和armbian 没有, 希望此工作流 弥补这个遗憾 让你更优雅的 安装openwrt 

name: Build 24.10.x ISO x86-64

on:
  workflow_dispatch:
    inputs:
      luci_version:
        description: "选择luci版本"
        required: false
        default: "24.10.6"
        type: choice
        options:
          - 24.10.0
          - 24.10.1
          - 24.10.2
          - 24.10.3
          - 24.10.4
          - 24.10.5
          - 24.10.6
      profile:
        description: '选择软件包空间大小'
        required: true
        type: choice
        default: '1G'
        options:
          - '1G'
          - '2G'
          - '3G'
          - '4G'
      include_docker:
        description: "是否编译 Docker 插件"
        required: true
        default: 'no'
        type: choice
        options:
          - 'yes'
          - 'no'
      enable_store:
        description: "集成 store 商店"
        required: false
        type: boolean
        default: true
      enable_pppoe:
        description: "是否配置PPPoE拨号信息?"
        required: true
        default: 'no'
        type: choice
        options:
          - 'yes'
          - 'no'
      pppoe_account:
        description: "宽带账号 (若启用PPPoE)"
        required: false
      pppoe_password:
        description: "宽带密码 (若启用PPPoE)"
        required: false

  schedule:
    # 每日自动构建兜底: 北京时间 07:40 (UTC 23:40), 晚于 sync-store 的北京时间 07:00
    - cron: '40 23 * * *'
  repository_dispatch:
    types: [store-synced]

permissions:
  contents: write
  actions: read

env:
  luci_version: ${{ github.event.inputs.luci_version || '24.10.6' }}
  profile: ${{ github.event.inputs.profile || '1G' }}
  include_docker: ${{ github.event.inputs.include_docker || 'no' }}
  enable_store: ${{ github.event.inputs.enable_store || 'true' }}
  enable_pppoe: ${{ github.event.inputs.enable_pppoe || 'no' }}

jobs:
  gate:
    uses: ./.github/workflows/autobuild-gate.yml
    with:
      flag_name: AUTO_BUILD_ISO_24_10
      workflow_file: build-iso.yml
  build_immortalwrt:
    needs: gate
    if: ${{ needs.gate.outputs.should_build == 'true' }}
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set executable permissions
        run: chmod +x ${{ github.workspace }}/x86-64/build24.sh
      
      - name: Enable Store integration
        run: |
          if [ "${{ env.enable_store }}" == "true" ]; then
            # 插入到自动生成段内(自动维护结束标记之前), 避免落到 imm 固定段之后
            sed -i '/# ============ 自动维护结束 ============/i CUSTOM_PACKAGES="$CUSTOM_PACKAGES luci-app-store"' shell/custom-packages.sh
            echo "✅ 已追加 luci-app-store"
          else
            echo "❎ 未启用 luci-app-store"
          fi

      - name: Validate PPPoE Inputs
        run: |
          if [[ "${{ env.enable_pppoe }}" == "yes" ]]; then
            if [[ -z "${{ env.pppoe_account }}" || -z "${{ env.pppoe_password }}" ]]; then
              echo "Error: PPPoE account and password must be provided when PPPoE is enabled!"
              exit 1
            fi
          fi

      - name: ✅ 正在构建ImmortalWrt固件
        run: |
          profile="${{ env.profile }}"
          case "$profile" in
            1G)
              ROOTFS_SIZE=1024
              ;;
            2G)
              ROOTFS_SIZE=2048
              ;;
            3G)
              ROOTFS_SIZE=3072
              ;;
            4G)
              ROOTFS_SIZE=4096
              ;;
          esac
          echo "ROOTFS_SIZE=$ROOTFS_SIZE" >> $GITHUB_ENV
          include_docker="${{ env.include_docker }}"
          luci_version="${{ env.luci_version }}"
          echo "Building for rootfs_size: $profile"
          docker run --rm -i \
              --user root \
              -v "${{ github.workspace }}/bin:/home/build/immortalwrt/bin" \
              -v "${{ github.workspace }}/files:/home/build/immortalwrt/files" \
              -v "${{ github.workspace }}/x86-64/imm.config:/home/build/immortalwrt/.config" \
              -v "${{ github.workspace }}/shell:/home/build/immortalwrt/shell" \
              -v "${{ github.workspace }}/store:/home/build/immortalwrt/store" \
              -v "${{ github.workspace }}/x86-64/build24.sh:/home/build/immortalwrt/build.sh" \
              -e PROFILE=$ROOTFS_SIZE \
              -e INCLUDE_DOCKER=$include_docker \
              -e ENABLE_PPPOE=${{ env.enable_pppoe }} \
              -e PPPOE_ACCOUNT=${{ env.pppoe_account }} \
              -e PPPOE_PASSWORD=${{ env.pppoe_password }} \
          immortalwrt/imagebuilder:x86-64-openwrt-${luci_version} /bin/bash -lc "set -o pipefail; /home/build/immortalwrt/build.sh 2>&1 | tee /tmp/imm_build.log"
         

      - name: ✅ 复制固件到根目录
        run: |
          cp ${{ github.workspace }}/bin/targets/x86/64/*squashfs-combined-efi.img.gz ${{ github.workspace }}

      - name: ✅ 上传固件到 artifact (for ISO generation)
        uses: actions/upload-artifact@v6
        with:
          name: firmware-img
          path: |
            *.img.gz

  build_installer_iso:
    runs-on: ubuntu-22.04
    needs: [build_immortalwrt, gate]

    steps:
      - name: Download firmware artifact
        uses: actions/download-artifact@v7
        with:
          name: firmware-img

      - name: ⏬ 同步 img-installer 项目 准备制作ISO
        run: |
          git clone https://github.com/wukongdaily/img-installer.git
          cd img-installer

      - name: Set executable permissions for scripts
        run: |
          chmod +x "${{ github.workspace }}/img-installer/custom.sh"
          chmod +x "${{ github.workspace }}/img-installer/supportFiles/custom/build.sh"

      - name: ✅ 制作 ISO
        run: |
          firmware_file=$(ls *squashfs-combined-efi.img.gz)
          cd img-installer
          bash autobuild/autobuild.sh "../$firmware_file"

      - name: 计算 Release 标签(每日一个 Release, 手动构建单独一个)
        run: |
          d="$(TZ=Asia/Shanghai date '+%Y-%m-%d')"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "REL_TAG=${{ env.TAG_BASE }}-$d-$(TZ=Asia/Shanghai date '+%H%M')" >> "$GITHUB_ENV"
          else
            echo "REL_TAG=${{ env.TAG_BASE }}-$d" >> "$GITHUB_ENV"
          fi
          echo "Release 标签: $REL_TAG"
          echo "BUILD_TIME=$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M') 北京时间" >> "$GITHUB_ENV"
        env:
          TAG_BASE: Custom-Installer-x86_64-ISO

      - name: 生成固件说明(Release Notes)
        run: |
          fw="$(ls img-installer/output/custom-installer-x86_64.iso 2>/dev/null | grep -E '\.(img|bin|iso|qcow2|vmdk)(\.gz)?$' | xargs -n1 basename 2>/dev/null | tr '\n' ' ')"
          pkgs="$(grep -m1 '第三方软件包:' "$RUNNER_TEMP"/build-logs/*.log 2>/dev/null | sed 's/^.*第三方软件包://' | tr -s ' ' | xargs 2>/dev/null || true)"
          if [ -z "$pkgs" ]; then
            pkgs="$(grep '^CUSTOM_PACKAGES=' shell/custom-packages.sh 2>/dev/null | sed 's/^CUSTOM_PACKAGES="\$CUSTOM_PACKAGES //; s/"$//' | tr '\n' ' ')"
          fi
          [ -n "$pkgs" ] || pkgs="未记录"
          {
            echo ""
            echo "## 固件基础信息"
            echo "- **固件**: $fw"
            echo "- **用户名**: root"
            echo "- **密码**: 无"
            echo "- **docker**: ${{ env.include_docker == 'yes' && '带docker' || '不带docker' }}"
            echo "- **luci 版本**: ${{ env.luci_version }}"
            echo "- **软件包空间**: ${{ env.profile }}"
            echo "- **构建时间**: $BUILD_TIME"
            echo "- **构建方式**: ${{ needs.gate.outputs.build_mode }}"
            echo "- **第三方插件**: $pkgs"
          } >> "${{ github.workspace }}/img-installer/autobuild/info.md"

      - name: 🚀 上传 ISO 到 Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.REL_TAG }}
          body_path: "${{ github.workspace }}/img-installer/autobuild/info.md"
          files: |
            img-installer/output/custom-installer-x86_64.iso
          fail_on_unmatched_files: true
          token: "${{ secrets.GITHUB_TOKEN }}"
