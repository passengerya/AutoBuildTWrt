name: Build 24.10.x RaspBerryPi

on:
  workflow_dispatch:
    inputs:
      profile:
        type: choice
        description: "请选择路由器型号"
        required: true
        options:
          - rpi-3
          - rpi-4
          - rpi-5
        default: rpi-4
      luci_version:
        description: "选择luci版本"
        required: false
        default: "24.10.6"
        type: choice
        options:
          - 24.10.0
          - 24.10.1
          - 24.10.2
          - 24.10.3
          - 24.10.4
          - 24.10.5
          - 24.10.6
      enable_store:
        description: "集成 store 商店"
        required: false
        type: boolean
        default: true
      include_docker:
        description: |
          是否编译 Docker 插件
        required: true
        default: 'no'
        type: choice
        options:
          - 'yes'
          - 'no'
      size:
        description: '请输入要编译固件大小 单位(MB)'
        required: true
        default: '1024'


  schedule:
    # 每日自动构建兜底: 北京时间 07:40 (UTC 23:40), 晚于 sync-store 的北京时间 07:00
    - cron: '40 23 * * *'
  repository_dispatch:
    types: [store-synced]

permissions:
  contents: write
  actions: read

env:
  profile: ${{ github.event.inputs.profile || 'rpi-4' }}
  luci_version: ${{ github.event.inputs.luci_version || '24.10.6' }}
  enable_store: ${{ github.event.inputs.enable_store || 'true' }}
  include_docker: ${{ github.event.inputs.include_docker || 'no' }}
  size: ${{ github.event.inputs.size || '1024' }}

jobs:
  gate:
    uses: ./.github/workflows/autobuild-gate.yml
    with:
      flag_name: AUTO_BUILD_RASPBERRYPI_24_10
      workflow_file: build-RaspBerryPi-24.10.x.yml
  build:
    needs: gate
    if: ${{ needs.gate.outputs.should_build == 'true' }}
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set executable permissions
        run: |
          chmod +x ${{ github.workspace }}/raspberrypi/24.10/build.sh
      
      - name: Enable Store integration
        run: |
          if [ "${{ env.enable_store }}" == "true" ]; then
            # 插入到自动生成段内(自动维护结束标记之前), 避免落到 imm 固定段之后
            sed -i '/# ============ 自动维护结束 ============/i CUSTOM_PACKAGES="$CUSTOM_PACKAGES luci-app-store"' shell/custom-packages.sh
            echo "✅ 已追加 luci-app-store"
          else
            echo "❎ 未启用 luci-app-store"
          fi
      
      
      - name: Build raspberrypi ImmortalWrt 24.10.x
        run: |
          luci_version="${{ env.luci_version }}"
          profiles="${{ env.profile }}"
          if [ "$profiles" = "rpi" ]; then
            tag=bcm27xx-bcm2708-openwrt-${luci_version}
            echo "cpu=bcm2708" >> $GITHUB_ENV
          elif [ "$profiles" = "rpi-2" ]; then
            tag=bcm27xx-bcm2709-openwrt-${luci_version}
            echo "cpu=bcm2709" >> $GITHUB_ENV
          elif [ "$profiles" = "rpi-3" ]; then
            ARCH=rpi3.conf
            tag=bcm27xx-bcm2710-openwrt-${luci_version}
            echo "cpu=bcm2710" >> $GITHUB_ENV
          elif [ "$profiles" = "rpi-4" ]; then
            ARCH=rpi4.conf
            tag=bcm27xx-bcm2711-openwrt-${luci_version}
            echo "cpu=bcm2711" >> $GITHUB_ENV
          elif [ "$profiles" = "rpi-5" ]; then
            ARCH=rpi5.conf
            tag=bcm27xx-bcm2712-openwrt-${luci_version}
            echo "cpu=bcm2712" >> $GITHUB_ENV
          fi
          include_docker="${{ env.include_docker }}"
          size="${{ env.size }}"
          
          IFS=',' read -r -a profile_array <<< "$profiles"
          for profile in "${profile_array[@]}"; do
            echo "Building for profile: $profile"
            
            docker run --rm -i \
              --user root \
              -v "${{ github.workspace }}/bin:/home/build/immortalwrt/bin" \
              -v "${{ github.workspace }}/files/etc/uci-defaults:/home/build/immortalwrt/files/etc/uci-defaults" \
              -v "${{ github.workspace }}/arch/$ARCH:/home/build/immortalwrt/files/etc/opkg/arch.conf" \
              -v "${{ github.workspace }}/shell:/home/build/immortalwrt/shell" \
              -v "${{ github.workspace }}/store:/home/build/immortalwrt/store" \
              -v "${{ github.workspace }}/raspberrypi/24.10/build.sh:/home/build/openwrt/build.sh" \
              -e PROFILE=$profile \
              -e LUCI_VERSION=$luci_version \
              -e INCLUDE_DOCKER=$include_docker \
              -e ROOTSIZE=$size \
              immortalwrt/imagebuilder:$tag /bin/bash -lc "set -o pipefail; /home/build/openwrt/build.sh 2>&1 | tee /tmp/imm_build.log"
          done
          ls ${{ github.workspace }}/bin/targets/bcm27xx/${{ env.cpu }}
      
      - name: Create info
        run: |
          if [ "${{ env.include_docker }}" == "yes" ]; then
            extra_content="### 默认带docker"
            echo -e "\n $extra_content" >> ${{ github.workspace }}/info.md
          else
            echo -e "NO docker"
          fi
 
      - name: 计算 Release 标签(每日一个 Release, 手动构建单独一个)
        run: |
          d="$(TZ=Asia/Shanghai date '+%Y-%m-%d')"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "REL_TAG=${{ env.TAG_BASE }}-$d-$(TZ=Asia/Shanghai date '+%H%M')" >> "$GITHUB_ENV"
          else
            echo "REL_TAG=${{ env.TAG_BASE }}-$d" >> "$GITHUB_ENV"
          fi
          echo "Release 标签: $REL_TAG"
        env:
          TAG_BASE: Autobuild-raspberrypi

      - name: 标注构建方式
        run: |
          printf '\n- 🏷️ **构建方式**: %s\n' "${{ needs.gate.outputs.build_label }}" >> "${{ github.workspace }}/info.md"

      - name: Upload ImmortalWrt as release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.REL_TAG }}
          body_path: ${{ github.workspace }}/info.md
          files: |
            ${{ github.workspace }}/bin/targets/bcm27xx/${{ env.cpu }}/*squashfs-factory.img.gz
          fail_on_unmatched_files: true
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
