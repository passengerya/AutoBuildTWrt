name: Build 24.10.x x86-64

on:
  workflow_dispatch:
    inputs:
      luci_version:
        description: "选择luci版本"
        required: false
        default: "24.10.6"
        type: choice
        options:
          - 24.10.0
          - 24.10.1
          - 24.10.2
          - 24.10.3
          - 24.10.4
          - 24.10.5
          - 24.10.6
      custom_router_ip:
        description: "请设置路由器的管理地址(仅对多网口路由器有效) 格式:192.168.x.1 或 10.x.x.1"
        required: true
        default: "192.168.100.1"
      profile:
        description: '选择软件包空间大小'
        required: true
        type: choice
        default: '1G'
        options:
          - '1G'
          - '2G'
          - '3G'
          - '4G'
      enable_store:
        description: "集成 store 商店"
        required: false
        type: boolean
        default: true
      include_docker:
        description: |
          是否编译 Docker 插件
        required: true
        default: 'no'
        type: choice
        options:
          - 'yes'
          - 'no'
      enable_pppoe:
        description: "是否配置PPPoE拨号信息?"
        required: true
        default: 'no'
        type: choice
        options:
        - 'yes'
        - 'no'
      pppoe_account:
        description: "宽带账号 (若启用PPPoE)"
        required: false
      pppoe_password:
        description: "宽带密码 (若启用PPPoE)"
        required: false

  schedule:
    # 每日自动构建兜底: 北京时间 07:40 (UTC 23:40), 晚于 sync-store 的北京时间 07:00
    - cron: '40 23 * * *'
  repository_dispatch:
    types: [store-synced]

permissions:
  contents: write
  actions: read

env:
  luci_version: ${{ github.event.inputs.luci_version || '24.10.6' }}
  custom_router_ip: ${{ github.event.inputs.custom_router_ip || '192.168.100.1' }}
  profile: ${{ github.event.inputs.profile || '1G' }}
  enable_store: ${{ github.event.inputs.enable_store || 'true' }}
  include_docker: ${{ github.event.inputs.include_docker || 'no' }}
  enable_pppoe: ${{ github.event.inputs.enable_pppoe || 'no' }}

jobs:
  gate:
    uses: ./.github/workflows/autobuild-gate.yml
    with:
      flag_name: AUTO_BUILD_X86_64_24_10
      workflow_file: build-x86-64-24.10.x.yml
  build:
    needs: gate
    if: ${{ needs.gate.outputs.should_build == 'true' }}
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set executable permissions
        run: chmod +x ${{ github.workspace }}/x86-64/build24.sh

      - name: Save Custom Router IP into OpenWrt files
        run: |
          mkdir -p "${{ github.workspace }}/custom"
          echo "${{ env.custom_router_ip }}" > "${{ github.workspace }}/custom/custom_router_ip.txt"
          echo "您设置的路由器管理地址是:${{ env.custom_router_ip }}"
          # 后续步骤会将该文件映射到路由器/etc/config/custom_router_ip.txt 以便用于开机脚本99-custom.sh读取用户设置的ip
      
      - name: Validate PPPoE Inputs
        run: |
          if [[ "${{ env.enable_pppoe }}" == "yes" ]]; then
            if [[ -z "${{ env.pppoe_account }}" || -z "${{ env.pppoe_password }}" ]]; then
              echo "Error: PPPoE account and password must be provided when PPPoE is enabled!"
              exit 1
            fi
          fi

      - name: Mask PPPoE inputs
        run: |
          if [ -n "$PPPOE_ACCOUNT" ]; then
            echo "::add-mask::$(printf '%s' "$PPPOE_ACCOUNT" | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')"
          fi
          if [ -n "$PPPOE_PASSWORD" ]; then
            echo "::add-mask::$(printf '%s' "$PPPOE_PASSWORD" | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')"
          fi
        env:
          PPPOE_ACCOUNT: ${{ env.pppoe_account }}
          PPPOE_PASSWORD: ${{ env.pppoe_password }}
      
      - name: Enable Store integration
        run: |
          if [ "${{ env.enable_store }}" == "true" ]; then
            # 插入到自动生成段内(自动维护结束标记之前), 避免落到 imm 固定段之后
            sed -i '/# ============ 自动维护结束 ============/i CUSTOM_PACKAGES="$CUSTOM_PACKAGES luci-app-store"' shell/custom-packages.sh
            echo "✅ 已追加 luci-app-store"
          else
            echo "❎ 未启用 luci-app-store"
          fi

      - name: Build ImmortalWrt-x86-64-efi 24.10.x
        run: |
          profile="${{ env.profile }}"
          case "$profile" in
            1G)
              ROOTFS_SIZE=1024
              ;;
            2G)
              ROOTFS_SIZE=2048
              ;;
            3G)
              ROOTFS_SIZE=3072
              ;;
            4G)
              ROOTFS_SIZE=4096
              ;;
          esac
          echo "ROOTFS_SIZE=$ROOTFS_SIZE" >> $GITHUB_ENV
          include_docker="${{ env.include_docker }}"
          luci_version="${{ env.luci_version }}"
          echo "Building for rootfs_size: $profile"
          # 构建日志写到 runner; 失败时由后续步骤上传为 artifact 诊断
          mkdir -p "$RUNNER_TEMP/build-logs"
          set -o pipefail
          docker run --rm -i \
            --user root \
            -v "${{ github.workspace }}/bin:/home/build/immortalwrt/bin" \
            -v "${{ github.workspace }}/files:/home/build/immortalwrt/files" \
            -v "${{ github.workspace }}/custom:/home/build/immortalwrt/files/etc/config" \
            -v "${{ github.workspace }}/x86-64/imm.config:/home/build/immortalwrt/.config" \
            -v "${{ github.workspace }}/shell:/home/build/immortalwrt/shell" \
            -v "${{ github.workspace }}/store:/home/build/immortalwrt/store" \
            -v "${{ github.workspace }}/x86-64/build24.sh:/home/build/immortalwrt/build.sh" \
            -e PROFILE=$ROOTFS_SIZE \
            -e INCLUDE_DOCKER=$include_docker \
            -e ENABLE_PPPOE=${{ env.enable_pppoe }} \
            -e PPPOE_ACCOUNT=${{ env.pppoe_account }} \
            -e PPPOE_PASSWORD=${{ env.pppoe_password }} \
            -e BUILD_LOG_DIR=/home/build/immortalwrt/bin/build-diag \
          immortalwrt/imagebuilder:x86-64-openwrt-${luci_version} \
            /bin/bash -lc "/home/build/immortalwrt/build.sh" \
            2>&1 | tee "$RUNNER_TEMP/build-logs/x86-64-24.10-build.log"

      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: build-diagnostics-24.10-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/build-logs/
            ${{ github.workspace }}/bin/build-diag/
          if-no-files-found: warn
          

      - name: Create info
        run: |
          cat > ${{ github.workspace }}/router-info.md <<EOF
          ## 📡 路由器后台信息
          <a href="https://wkdaily.cpolar.cn/archives/1">
           <img src="https://img.shields.io/badge/若下载慢可套用国内加速站下载-FC7C0D?logo=github&logoColor=fff&labelColor=000&style=for-the-badge"/>
          </a>
          
          - 🏠 **后台地址**: ${{ env.custom_router_ip }}
          - 👤 **用户名**: root
          - 🔑 **密码**: 无
          EOF

          if [ "${{ env.include_docker }}" == "yes" ]; then
            extra_content="#### 默认带docker"
            echo -e "\n$extra_content" >> ${{ github.workspace }}/router-info.md
          else
            echo -e "\n#### 不带docker" >> ${{ github.workspace }}/router-info.md
          fi

      - name: 固件按构建时间重命名(不覆盖历史固件)
        run: |
          ts="$(TZ=Asia/Shanghai date '+%Y%m%d-%H%M')"
          for f in ${{ github.workspace }}/bin/targets/x86/64/*squashfs-combined-efi.img.gz; do
            [ -f "$f" ] || continue
            case "$f" in
              *.img.gz) mv "$f" "${{f%.img.gz}}-$ts.img.gz" ;;
              *.tar.gz) mv "$f" "${{f%.tar.gz}}-$ts.tar.gz" ;;
              *.iso)    mv "$f" "${{f%.iso}}-$ts.iso" ;;
              *.qcow2)  mv "$f" "${{f%.qcow2}}-$ts.qcow2" ;;
              *.vmdk)   mv "$f" "${{f%.vmdk}}-$ts.vmdk" ;;
              *)        mv "$f" "${{f%.*}}-$ts.${{f##*.}}" ;;
            esac
            echo "已重命名: $f"
          done

      - name: 标注构建方式
        run: |
          printf '\n- 🏷️ **构建方式**: %s\n' "${{ needs.gate.outputs.build_label }}" >> "${{ github.workspace }}/router-info.md"

      - name: Upload ImmortWrt as release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: Autobuild-x86-64
          body_path: ${{ github.workspace }}/router-info.md
          files: |
            ${{ github.workspace }}/bin/targets/x86/64/*squashfs-combined-efi.img.gz
          fail_on_unmatched_files: true
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 清理旧固件(Release 保留最新 20 个)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag='Autobuild-x86-64'
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq '.assets[] | [.id, .updated_at] | @tsv' \
            | sort -k2 -r | tail -n +21 | cut -f1 | while read -r id; do
              [ -n "$id" ] || continue
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$id" >/dev/null
              echo "🗑️ 已删除旧固件 asset $id"
            done
