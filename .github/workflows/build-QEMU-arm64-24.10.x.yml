name: Build 24.10.x QEMU-armsr-armv8
# 你可以理解为这是一种ARM64平台下通用型OpenWrt ,产出格式为qcow2,适合所有ARM64平台的虚拟机
# 比如斐讯N1刷了armbian系统,armbian系统里安装了PVE虚拟机 可用
# 比如新款Apple Silicon芯片的苹果电脑里的虚拟机UTM 可用
# 比如友善NanoPi R3S、R5S 官方推出的预装了PVE的debian系统 可用
# 比如瑞莎E20C刷了Armbian系统，自己安装了QEMU+KVM虚拟机 可用
on:
  workflow_dispatch:
    inputs:
      luci_version:
        description: "选择luci版本"
        required: false
        default: "24.10.6"
        type: choice
        options:
          - 24.10.0
          - 24.10.1
          - 24.10.2
          - 24.10.3
          - 24.10.4
          - 24.10.5
          - 24.10.6
      profile:
        type: choice
        description: |
          可用于ARM64虚拟机(比如macOS下的UTM虚拟机 比如斐讯N1/R3S/R5S等arm64系统的PVE虚拟机)
        options:
          - generic
        required: true
        default: 'generic'
      rootfs_partsize:
        description: '设置软件包大小 单位(MB) 最大数值10240'
        required: true
        default: '2048'
      enable_store:
        description: "集成 store 商店"
        required: false
        type: boolean
        default: true
      enable_pppoe:
        description: "是否配置PPPoE拨号信息?"
        required: true
        default: 'no'
        type: choice
        options:
        - 'yes'
        - 'no'
      pppoe_account:
        description: "宽带账号 (若启用PPPoE)"
        required: false
      pppoe_password:
        description: "宽带密码 (若启用PPPoE)"
        required: false

  schedule:
    # 每日自动构建兜底: 北京时间 07:40 (UTC 23:40), 晚于 sync-store 的北京时间 07:00
    - cron: '40 23 * * *'
  repository_dispatch:
    types: [store-synced]

permissions:
  contents: write
  actions: read

env:
  luci_version: ${{ github.event.inputs.luci_version || '24.10.6' }}
  profile: ${{ github.event.inputs.profile || 'generic' }}
  rootfs_partsize: ${{ github.event.inputs.rootfs_partsize || '2048' }}
  enable_store: ${{ github.event.inputs.enable_store || 'true' }}
  enable_pppoe: ${{ github.event.inputs.enable_pppoe || 'no' }}

jobs:
  gate:
    uses: ./.github/workflows/autobuild-gate.yml
    with:
      flag_name: AUTO_BUILD_QEMU_24_10
      workflow_file: build-QEMU-arm64-24.10.x.yml
  build:
    needs: gate
    if: ${{ needs.gate.outputs.should_build == 'true' }}
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set executable permissions
        run: chmod +x ${{ github.workspace }}/armsr-armv8/build.sh
      
      - name: Enable Store integration
        run: |
          if [ "${{ env.enable_store }}" == "true" ]; then
            # 插入到自动生成段内(自动维护结束标记之前), 避免落到 imm 固定段之后
            sed -i '/# ============ 自动维护结束 ============/i CUSTOM_PACKAGES="$CUSTOM_PACKAGES luci-app-store"' shell/custom-packages.sh
            echo "✅ 已追加 luci-app-store"
          else
            echo "❎ 未启用 luci-app-store"
          fi
      
      - name: Validate PPPoE Inputs
        run: |
          if [[ "${{ env.enable_pppoe }}" == "yes" ]]; then
            if [[ -z "${{ env.pppoe_account }}" || -z "${{ env.pppoe_password }}" ]]; then
              echo "Error: PPPoE account and password must be provided when PPPoE is enabled!"
              exit 1
            fi
          fi
      
      - name: Building armsr-armv8 QEMU ImmortalWrt 24.10.x
        run: |
          profiles="${{ env.profile }}"
          rootfs_partsize="${{ env.rootfs_partsize }}"
          luci_version="${{ env.luci_version }}"
          
          IFS=',' read -r -a profile_array <<< "$profiles"
          
          for profile in "${profile_array[@]}"; do
            echo "Building for profile: $profile"
            
            docker run --rm -i \
              --user root \
              -v "${{ github.workspace }}/bin:/home/build/immortalwrt/bin" \
              -v "${{ github.workspace }}/files/etc/uci-defaults:/home/build/immortalwrt/files/etc/uci-defaults" \
              -v "${{ github.workspace }}/arch/arch.conf:/home/build/immortalwrt/files/etc/opkg/arch.conf" \
              -v "${{ github.workspace }}/armsr-armv8/imm.config:/home/build/immortalwrt/.config" \
              -v "${{ github.workspace }}/shell:/home/build/immortalwrt/shell" \
              -v "${{ github.workspace }}/store:/home/build/immortalwrt/store" \
              -v "${{ github.workspace }}/armsr-armv8/build.sh:/home/build/immortalwrt/build.sh" \
              -e PROFILE=$profile \
              -e ROOTFS_PARTSIZE=$rootfs_partsize \
              -e ENABLE_PPPOE=${{ env.enable_pppoe }} \
              -e PPPOE_ACCOUNT=${{ env.pppoe_account }} \
              -e PPPOE_PASSWORD=${{ env.pppoe_password }} \
              immortalwrt/imagebuilder:armsr-armv8-openwrt-${luci_version} /bin/bash -lc "set -o pipefail; /home/build/immortalwrt/build.sh 2>&1 | tee /tmp/imm_build.log"
          done
      - name: Copy Firmware to workspace
        run: |
          cp ${{ github.workspace }}/bin/targets/armsr/armv8/*.qcow2 ${{ github.workspace }}
          cp ${{ github.workspace }}/bin/targets/armsr/armv8/*.vmdk ${{ github.workspace }}

      - name: 标注构建方式
        run: |
          printf '\n- 🏷️ **构建方式**: %s\n' "${{ needs.gate.outputs.build_label }}" >> "${{ github.workspace }}/armsr-armv8/info.md"

      - name: Upload ImmortWrt as release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: QEMU
          name: ImmortWrt-QEMU-armsr-armv8-24.10.x
          body_path: ${{ github.workspace }}/armsr-armv8/info.md
          files: |
            ${{ github.workspace }}/*.qcow2 
            ${{ github.workspace }}/*.vmdk
          fail_on_unmatched_files: true
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
