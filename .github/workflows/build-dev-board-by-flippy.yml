name: Build Dev Board Firmware(Flippy)
on:
  workflow_dispatch:
    inputs:
      luci_version:
        description: "选择luci版本"
        required: false
        default: "24.10.6"
        type: choice
        options:
          - 24.10.0
          - 24.10.1
          - 24.10.2
          - 24.10.3
          - 24.10.4
          - 24.10.5
          - 24.10.6
      openwrt_kernel:
        description: "选择构建的内核 当高版本内核没有时 系统会自动挑选匹配的内核。比如radxa e52c 即便你选择了6.1.y 可能最终构建还是5.10.160"
        required: false
        default: "6.1.y"
        type: choice
        options:
          - 5.4.y
          - 5.10.y
          - 5.15.y
          - 6.1.y
          - 6.6.y
          - 6.12.y
      openwrt_soc:
        description: "选择开发板型号"
        required: false
        default: "e20c"
        type: choice
        options:
          - e20c
          - e24c
          - e25
          - e52c
          - e54c
          - rock5b
          - rock5c
          - r66s
          - r68s
          - ht2
          - h28k
          - h66k
          - h68k
          - h69k
          - h69k-max
          - h88k
          - h88k-v3
          - jp-tvbox
          - l1pro
          - s905
          - s905x2
          - s905x3
          - s912
          - s922x
          - s922x-n2

      include_docker:
        description: |
          是否编译 Docker 插件
        required: true
        default: 'no'
        type: choice
        options:
          - 'yes'
          - 'no'
      skip_imagebuilder:
        description: "直接使用底包快速构建固件, 忽略自定义插件 ----（跳过 ImageBuilder）"
        required: false
        default: false
        type: boolean
      replace_banner:
        description: '替换为ImmortalWrt的banner信息'
        required: false
        default: false
        type: boolean
      rootfs_partsize:
        description: '软件包大小1G固定'
        required: true
        default: "1024"
        type: choice
        options:
          - '1024'
      builder_name:
        description: "设置打包作者的名称"
        required: true
        default: 'wukongdaily'

  schedule:
    # 每日自动构建兜底: 北京时间 07:40 (UTC 23:40), 晚于 sync-store 的北京时间 07:00
    - cron: '40 23 * * *'
  repository_dispatch:
    types: [store-synced]

permissions:
  contents: write
  actions: read

env:
  luci_version: ${{ github.event.inputs.luci_version || '24.10.6' }}
  openwrt_kernel: ${{ github.event.inputs.openwrt_kernel || '6.1.y' }}
  openwrt_soc: ${{ github.event.inputs.openwrt_soc || 'e20c' }}
  include_docker: ${{ github.event.inputs.include_docker || 'no' }}
  skip_imagebuilder: ${{ github.event.inputs.skip_imagebuilder || 'false' }}
  replace_banner: ${{ github.event.inputs.replace_banner || 'false' }}
  rootfs_partsize: ${{ github.event.inputs.rootfs_partsize || '1024' }}
  builder_name: ${{ github.event.inputs.builder_name || 'wukongdaily' }}

jobs:
  gate:
    uses: ./.github/workflows/autobuild-gate.yml
    with:
      flag_name: AUTO_BUILD_FLIPPY_24_10
      workflow_file: build-dev-board-by-flippy.yml
  build:
    needs: gate
    if: ${{ needs.gate.outputs.should_build == 'true' }}
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set executable permissions
        run: chmod +x ${{ github.workspace }}/n1/build.sh

      - name: Debug workspace contents
        run: ls -R

      - name: 处理是否替换 banner 信息
        if: ${{ env.skip_imagebuilder == 'false' && env.replace_banner == 'true' }}
        run: |
          # 使用ImageBuilder构建 且用户勾选了替换banner时
          cp n1/99-banner.sh files/etc/uci-defaults/
      
      - name: Build Rootfs for Radxa and Other Boards (ImmortalWrt)
        if: ${{ env.skip_imagebuilder != 'true' }}
        run: |
          echo "✅ 使用 ImageBuilder 构建 rootfs"
          profiles="generic"
          include_docker="${{ env.include_docker }}"
          rootfs_partsize="${{ env.rootfs_partsize }}"
          luci_version="${{ env.luci_version }}"
          
          IFS=',' read -r -a profile_array <<< "$profiles"
          
          for profile in "${profile_array[@]}"; do
            echo "Building for profile: $profile"
            
            docker run --rm -i \
              --user root \
              -v "${{ github.workspace }}/bin:/home/build/immortalwrt/bin" \
              -v "${{ github.workspace }}/files/etc/uci-defaults:/home/build/immortalwrt/files/etc/uci-defaults" \
              -v "${{ github.workspace }}/arch/arch.conf:/home/build/immortalwrt/files/etc/opkg/arch.conf" \
              -v "${{ github.workspace }}/shell:/home/build/immortalwrt/shell" \
              -v "${{ github.workspace }}/store:/home/build/immortalwrt/store" \
              -v "${{ github.workspace }}/n1/banner:/home/build/immortalwrt/files/mnt/banner" \
              -v "${{ github.workspace }}/n1/imm.config:/home/build/immortalwrt/.config" \
              -v "${{ github.workspace }}/n1/build.sh:/home/build/immortalwrt/build.sh" \
              -e PROFILE=$profile \
              -e INCLUDE_DOCKER=$include_docker \
              -e ROOTFS_PARTSIZE=$rootfs_partsize \
              immortalwrt/imagebuilder:armsr-armv8-openwrt-${luci_version} /bin/bash -lc "set -o pipefail; /home/build/immortalwrt/build.sh 2>&1 | tee /tmp/imm_build.log"
          done
          
      - name: Download prebuilt rootfs.tar.gz
        if: ${{ env.skip_imagebuilder == 'true' }}
        run: |
          echo "📦 正在下载预构建 rootfs"
          echo "PREBUILT_LUCI_VERSION=24.10.2" >> $GITHUB_ENV
          mkdir -p bin/targets/armsr/armv8
          curl -L -o bin/targets/armsr/armv8/openwrt-armvirt-64-default-rootfs.tar.gz \
            https://github.com/wukongdaily/AutoBuildImmortalWrt/releases/download/rootfs/immortalwrt-24.10.2-armsr-armv8-generic-rootfs.tar.gz

      - name: 查找rootfs.tar.gz所在路径
        id: find_rootfs
        run: |
          ROOTFS_FILE=$(find bin/targets/armsr/armv8/ -type f -name "*rootfs.tar.gz" | head -n1)
          echo "✅ Found: $ROOTFS_FILE"
          if [ ! -f "$ROOTFS_FILE" ]; then
            echo "❌ 找不到 rootfs.tar.gz 文件"
            exit 1
          fi
          echo "file=$ROOTFS_FILE" >> $GITHUB_OUTPUT

      - name: Package armsr-armv8 as ImmortalWrt for Radxa
        uses: wukongdaily/flippy-openwrt-actions@kernel-6.1
        if: ${{ steps.down.outputs.status }} == 'success' && !cancelled()
        env:
          OPENWRT_ARMVIRT: ${{ steps.find_rootfs.outputs.file }}
          PACKAGE_SOC: ${{ env.openwrt_soc }}
          KERNEL_VERSION_NAME: ${{ env.openwrt_kernel }}
          KERNEL_AUTO_LATEST: true
          KERNEL_REPO_URL: "ophub/kernel"
          WHOAMI: ${{ env.builder_name }}

      - name: Rename .img.gz file
        id: rename
        run: |
          FILE=$(ls ${{ env.PACKAGED_OUTPUTPATH }}/*.img.gz | head -n1)
          echo "Image file is: $FILE"
          FILENAME=$(basename "$FILE")
          echo "FILENAME=$FILENAME" >> $GITHUB_ENV
          KERNEL_VERSION=$(echo "$FILENAME" | grep -oP 'k\d+\.\d+\.\d+')
          MODEL=${{ env.openwrt_soc }}
          if [ -n "$PREBUILT_LUCI_VERSION" ]; then
              echo "PREBUILT_LUCI_VERSION is not empty: $PREBUILT_LUCI_VERSION"
              mv "$FILE" "${{ env.PACKAGED_OUTPUTPATH }}/immortalwrt-$PREBUILT_LUCI_VERSION-$MODEL-btrfs-$KERNEL_VERSION.img.gz"
          else
              LUCI_VERSION="${{ env.luci_version }}"
              mv "$FILE" "${{ env.PACKAGED_OUTPUTPATH }}/immortalwrt-$LUCI_VERSION-$MODEL-btrfs-$KERNEL_VERSION.img.gz"
          fi
         

      - name: 计算 Release 标签(每日一个 Release, 手动构建单独一个)
        run: |
          d="$(TZ=Asia/Shanghai date '+%Y-%m-%d')"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "REL_TAG=${{ env.TAG_BASE }}-$d-$(TZ=Asia/Shanghai date '+%H%M')" >> "$GITHUB_ENV"
          else
            echo "REL_TAG=${{ env.TAG_BASE }}-$d" >> "$GITHUB_ENV"
          fi
          echo "Release 标签: $REL_TAG"
          echo "BUILD_TIME=$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M') 北京时间" >> "$GITHUB_ENV"
        env:
          TAG_BASE: flippy

      - name: 生成固件说明(Release Notes)
        run: |
          fw="$(ls ${{ env.PACKAGED_OUTPUTPATH }}/*.img.gz 2>/dev/null | grep -E '\.(img|bin|iso|qcow2|vmdk)(\.gz)?$' | xargs -n1 basename 2>/dev/null | tr '\n' ' ')"
          pkgs="$(grep -m1 '第三方软件包:' "$RUNNER_TEMP"/build-logs/*.log 2>/dev/null | sed 's/^.*第三方软件包://' | tr -s ' ' | xargs 2>/dev/null || true)"
          if [ -z "$pkgs" ]; then
            pkgs="$(grep '^CUSTOM_PACKAGES=' shell/custom-packages.sh 2>/dev/null | sed 's/^CUSTOM_PACKAGES="\$CUSTOM_PACKAGES //; s/"$//' | tr '\n' ' ')"
          fi
          [ -n "$pkgs" ] || pkgs="未记录"
          {
            echo ""
            echo "## 固件基础信息"
            echo "- **固件**: $fw"
            echo "- **用户名**: root"
            echo "- **密码**: 无"
            echo "- **docker**: ${{ env.include_docker == 'yes' && '带docker' || '不带docker' }}"
            echo "- **luci 版本**: ${{ env.luci_version }}"
            echo "- **软件包空间**: ${{ env.rootfs_partsize }}"
            echo "- **构建时间**: $BUILD_TIME"
            echo "- **构建方式**: ${{ needs.gate.outputs.build_mode }}"
            echo "- **第三方插件**: $pkgs"
          } >> "${{ github.workspace }}/n1/radxa.md"

      - name: Upload firmware to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.REL_TAG }}
          name: ImmortalWrt for Radxa Series and Similar Devices
          body_path: ${{ github.workspace }}/n1/radxa.md
          files: |
            ${{ env.PACKAGED_OUTPUTPATH }}/*.img.gz
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
