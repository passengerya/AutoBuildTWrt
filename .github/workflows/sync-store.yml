# 从 CloudRunFilesBuilder 的 release 同步 .run 文件到本仓库内嵌 store/run/ 目录
#
# 触发方式:
#   1. 主动通知: builder 全部构建完成后发 repository_dispatch(event_type: builder-done),
#      store 即时同步, 不必等定时
#   2. 定时: 每天北京时间 07:00(UTC 23:00), 兜底(通知漏发/全部失败时仍会同步)
#   3. 手动: workflow_dispatch(可指定其它源仓库)
#
# 同步成功后的下游动作: 仅「定时触发」的同步会发 repository_dispatch(store-synced)
# 通知各构建工作流即刻执行每日自动构建(开关见仓库根目录 build-flags.conf);
# 构建工作流自身还有北京时间 07:40(UTC 23:40)的定时兜底。
#
# 注意: 定时/通知触发只会使用默认分支(master)上的 workflow 文件,
#       请把本文件合并到 master 分支后才会生效。

name: Sync Store

on:
  workflow_dispatch:
    inputs:
      builder_repo:
        description: '源仓库(owner/repo)'
        required: false
        default: 'passengerya/CloudRunFilesBuilder'
  repository_dispatch:
    types: [builder-done]
  schedule:
    # 北京时间 07:00 = UTC 23:00
    - cron: '0 23 * * *'

permissions:
  contents: write

concurrency:
  group: sync-store
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Sync run files
        env:
          BUILDER_REPO: ${{ inputs.builder_repo || 'passengerya/CloudRunFilesBuilder' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 store/sync_run_files.py

      - name: Commit and push
        env:
          BUILDER_REPO: ${{ inputs.builder_repo || 'passengerya/CloudRunFilesBuilder' }}
        run: |
          if [ -z "$(git status --porcelain store/ shell/)" ]; then
            echo "没有变化, 跳过提交。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add store/ shell/
          git commit -m "sync: 从 ${BUILDER_REPO} 同步 run 文件到内嵌 store ($(date -u +%F))" \
            -m "Co-Authored-By: Claude Code <noreply@anthropic.com>"
          # push 失败自动 rebase 重试: 上游 builder 完成通知集中到达时会触发一批同步,
          # checkout 与 push 之间远程 master 可能已被其它提交更新(2026-09-18 实测
          # 出现 fetch first 拒绝), rebase 后重推即可自愈。
          for i in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push 失败(第 $i 次), rebase 后重试..."
            git pull --rebase origin master || true
            sleep 5
          done
          echo "❌ push 3 次仍失败"
          exit 1

      - name: Notify daily auto builds
        # 仅每日定时同步成功后即刻通知各构建工作流(builder-done 同步不通知,
        # 避免上游每日分批构建中途的半成品 store 触发构建)
        if: ${{ success() && github.event_name == 'schedule' }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: token $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/dispatches" \
            -d '{"event_type":"store-synced"}')
          echo "✅ 已通知每日自动构建 (HTTP $code)"
