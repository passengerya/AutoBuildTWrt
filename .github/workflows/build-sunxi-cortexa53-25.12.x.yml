name: Build 25.12.x sunxi-cortexa53

on:
  workflow_dispatch:
    inputs:
      profile:
        type: choice
        description: "请选择开发板型号"
        required: true
        options:
          - xunlong_orangepi-zero3
          - friendlyarm_nanopi-r1s-h5
          - xunlong_orangepi-zero2
          - xunlong_orangepi-zero-plus
          - friendlyarm_nanopi-neo2
          - xunlong_orangepi-pc2
          - friendlyarm_nanopi-neo-plus2
          - libretech_all-h3-cc-h5
          - pine64_pine64-plus
          - pine64_sopine-baseboard
        default: xunlong_orangepi-zero3
      luci_version:
        description: "选择luci版本"
        required: false
        default: "25.12.1"
        type: choice
        options:
          - 25.12.0
          - 25.12.1
      enable_store:
        description: "集成 store 商店"
        required: false
        type: boolean
        default: false
      include_docker:
        description: |
          是否编译 Docker 插件
        required: true
        default: 'no'
        type: choice
        options:
          - 'yes'
          - 'no'
      rootfs_partsize:
        description: '选择软件包空间大小'
        required: true
        type: choice
        default: '1G'
        options:
          - '1G'
          - '2G'
          - '3G'
          - '4G'


  schedule:
    # 每日自动构建兜底: 北京时间 07:40 (UTC 23:40), 晚于 sync-store 的北京时间 07:00
    - cron: '40 23 * * *'
  repository_dispatch:
    types: [store-synced]

permissions:
  contents: write
  actions: read

env:
  profile: ${{ github.event.inputs.profile || 'xunlong_orangepi-zero3' }}
  luci_version: ${{ github.event.inputs.luci_version || '25.12.1' }}
  enable_store: ${{ github.event.inputs.enable_store || 'false' }}
  include_docker: ${{ github.event.inputs.include_docker || 'no' }}
  rootfs_partsize: ${{ github.event.inputs.rootfs_partsize || '1G' }}

jobs:
  gate:
    uses: ./.github/workflows/autobuild-gate.yml
    with:
      flag_name: AUTO_BUILD_SUNXI_25_12
      workflow_file: build-sunxi-cortexa53-25.12.x.yml
  build:
    needs: gate
    if: ${{ needs.gate.outputs.should_build == 'true' }}
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set executable permissions
        run: |
          chmod +x ${{ github.workspace }}/sunxi-cortexa53/build25.sh
    
      - name: Enable Store integration
        run: |
          if [ "${{ env.enable_store }}" == "true" ]; then
            # 插入到自动生成段内(自动维护结束标记之前), 避免落到 imm 固定段之后
            sed -i '/# ============ 自动维护结束 ============/i CUSTOM_PACKAGES="$CUSTOM_PACKAGES luci-app-store"' shell/apk-custom-packages.sh
            echo "✅ 已追加 luci-app-store"
          else
            echo "❎ 未启用 luci-app-store"
          fi
      - name: Build sunxi-cortexa53 ImmpotalWrt 25.12.x
        run: |
          profiles="${{ env.profile }}"
          include_docker="${{ env.include_docker }}"
          rootfs_partsize="${{ env.rootfs_partsize }}"
          case "$rootfs_partsize" in
            1G)
              ROOTFS_SIZE=1024
              ;;
            2G)
              ROOTFS_SIZE=2048
              ;;
            3G)
              ROOTFS_SIZE=3072
              ;;
            4G)
              ROOTFS_SIZE=4096
              ;;
          esac
          echo "ROOTFS_SIZE=$ROOTFS_SIZE" >> $GITHUB_ENV
          luci_version="${{ env.luci_version }}"
          docker run --rm -i \
              --user root \
              -v "${{ github.workspace }}/bin:/home/build/immortalwrt/bin" \
              -v "${{ github.workspace }}/files/etc/uci-defaults:/home/build/immortalwrt/files/etc/uci-defaults" \
              -v "${{ github.workspace }}/shell:/home/build/immortalwrt/shell" \
              -v "${{ github.workspace }}/store:/home/build/immortalwrt/store" \
              -v "${{ github.workspace }}/sunxi-cortexa53/build25.sh:/home/build/immortalwrt/build.sh" \
              -e PROFILE=$profile \
              -e INCLUDE_DOCKER=$include_docker \
              -e ROOTFS_PARTSIZE=$ROOTFS_SIZE \
          immortalwrt/imagebuilder:sunxi-cortexa53-openwrt-${luci_version} /bin/bash -lc "set -o pipefail; /home/build/immortalwrt/build.sh 2>&1 | tee /tmp/imm_build.log"
         

     
      - name: 计算 Release 标签(每日一个 Release, 手动构建单独一个)
        run: |
          d="$(TZ=Asia/Shanghai date '+%Y-%m-%d')"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "REL_TAG=${{ env.TAG_BASE }}-$d-$(TZ=Asia/Shanghai date '+%H%M')" >> "$GITHUB_ENV"
          else
            echo "REL_TAG=${{ env.TAG_BASE }}-$d" >> "$GITHUB_ENV"
          fi
          echo "Release 标签: $REL_TAG"
          echo "BUILD_TIME=$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M') 北京时间" >> "$GITHUB_ENV"
        env:
          TAG_BASE: Autobuild-sunxi-cortexa53

      - name: 生成固件说明(Release Notes)
        run: |
          fw="$(ls ${{ github.workspace }}/bin/targets/sunxi/cortexa53/*squashfs-sdcard.img.gz 2>/dev/null | grep -E '\.(img|bin|iso|qcow2|vmdk)(\.gz)?$' | xargs -n1 basename 2>/dev/null | tr '\n' ' ')"
          pkgs="$(grep -m1 '第三方软件包:' "$RUNNER_TEMP"/build-logs/*.log 2>/dev/null | sed 's/^.*第三方软件包://' | tr -s ' ' | xargs 2>/dev/null || true)"
          if [ -z "$pkgs" ]; then
            pkgs="$(grep '^CUSTOM_PACKAGES=' shell/apk-custom-packages.sh 2>/dev/null | sed 's/^CUSTOM_PACKAGES="\$CUSTOM_PACKAGES //; s/"$//' | tr '\n' ' ')"
          fi
          [ -n "$pkgs" ] || pkgs="未记录"
          {
            echo ""
            echo "## 固件基础信息"
            echo "- **固件**: $fw"
            echo "- **用户名**: root"
            echo "- **密码**: 无"
            echo "- **docker**: ${{ env.include_docker == 'yes' && '带docker' || '不带docker' }}"
            echo "- **luci 版本**: ${{ env.luci_version }}"
            echo "- **软件包空间**: ${{ env.rootfs_partsize }}"
            echo "- **构建时间**: $BUILD_TIME"
            echo "- **构建方式**: ${{ needs.gate.outputs.build_mode }}"
            echo "- **第三方插件**: $pkgs"
          } >> "${{ github.workspace }}/sunxi-cortexa53/info.md"

      - name: Upload ImmortWrt as release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.REL_TAG }}
          name: ImmortalWrt-sunxi-cortexa53
          body_path: ${{ github.workspace }}/sunxi-cortexa53/info.md
          files: |
            ${{ github.workspace }}/bin/targets/sunxi/cortexa53/*squashfs-sdcard.img.gz
          fail_on_unmatched_files: true
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
