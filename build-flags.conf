# ============================================================
# 每日自动构建集中开关 (0=关闭, 1=开启)
#
# 修改本文件后推送到 master 即生效, 无需改动各工作流文件。
#
# 自动构建的两种触发:
#   ① Sync Store 每日同步完成后即刻触发(repository_dispatch: store-synced,
#      仅由每天 23:00 UTC 的定时同步发出, 上游 builder 全部完成后);
#   ② 每日 23:40 UTC(北京时间 07:40)定时兜底(同步失败/漏发时仍会构建)。
# 去重: 同一工作流 20 小时内只自动构建一次; 当日已手动构建过的自动跳过。
# 参数: 自动构建使用各工作流输入项的默认值; 如需自定义参数请手动运行工作流。
# 标识: Release 说明会标注「每日自动构建/手动构建 + UTC 时间」。
# ============================================================

