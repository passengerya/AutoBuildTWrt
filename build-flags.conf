# ============================================================
# 每日自动构建集中开关 (0=关闭, 1=开启)
#
# 修改本文件后推送到 master 即生效, 无需改动各工作流文件。
#
# 自动构建的两种触发:
#   ① Sync Store 每日同步完成后即刻触发(repository_dispatch: store-synced,
#      即每天北京时间 07:00 左右的定时同步, 在上游 builder 全部完成后);
#   ② 每日北京时间 07:40(UTC 23:40)定时兜底(同步失败/漏发时仍会构建)。
# 去重: 同一工作流 20 小时内只自动构建一次; 当日已手动构建过的自动跳过。
# 参数: 自动构建使用各工作流输入项的默认值; 如需自定义参数请手动运行工作流。
# 发布: 每天自动构建发布到当天的新 Release(如 Autobuild-x86-64-2026-09-18),
#       当天各通道固件进同一清单, 历史固件永不覆盖; 手动构建每次创建
#       独立的新 Release(tag 加 -HHMM); Release 说明标注「构建方式 + 北京时间」。
# ============================================================

# ───────────────────── x86-64 固件与安装器 ─────────────────────
# x86-64 24.10 通道 EFI 固件(最常用的软路由/工控机固件, Release: Autobuild-x86-64)
AUTO_BUILD_X86_64_24_10=1
# x86-64 25.12 通道 EFI 固件(apk 软件通道, Release: Autobuild-x86-64)
AUTO_BUILD_X86_64_25_12=1
# x86-64 24.10 ISO 安装器(写入 U 盘引导安装用, Release: Custom-Installer-x86_64-ISO)
AUTO_BUILD_ISO_24_10=1
# x86-64 25.12 ISO 安装器(Release: Custom-Installer-x86_64-ISO)
AUTO_BUILD_ISO_25_12=1

# ───────────────────── 开发板固件 ─────────────────────
# Rockchip 开发板 24.10 固件(如 友善 NanoPi R3S, Release: Autobuild)
AUTO_BUILD_ROCKCHIP_24_10=0
# Rockchip 开发板 25.12 固件(Release: Autobuild)
AUTO_BUILD_ROCKCHIP_25_12=0
# 全志 sunxi 开发板 24.10 固件(如 香橙派 Zero3, Release: Autobuild-sunxi-cortexa53)
AUTO_BUILD_SUNXI_24_10=0
# 全志 sunxi 开发板 25.12 固件(Release: Autobuild-sunxi-cortexa53)
AUTO_BUILD_SUNXI_25_12=0
# Flippy 系列开发板固件(如 Radxa E20C, Release: flippy)
AUTO_BUILD_FLIPPY_24_10=0
# ophub 系列盒子/开发板固件(晶晨 a311d-oes 等, Release: ophub)
AUTO_BUILD_OPHUB_24_10=0

# ───────────────────── 路由器/盒子/通用 ARM64 ─────────────────────
# 无线路由器 24.10 固件(MTK/高通/博通硬路由, 如 GL-MT6000, Release 为设备型号)
AUTO_BUILD_WIRELESS_24_10=0
# 无线路由器 25.12 固件(Release 为设备型号)
AUTO_BUILD_WIRELESS_25_12=0
# 斐讯 N1 盒子 24.10 固件(Release: phicomm-n1)
AUTO_BUILD_N1_24_10=0
# QEMU/armsr-armv8 通用 ARM64 固件(虚拟机/通用 ARM 板, Release: QEMU)
AUTO_BUILD_QEMU_24_10=0
# 树莓派 24.10 固件(Release: Autobuild-raspberrypi)
AUTO_BUILD_RASPBERRYPI_24_10=0
