# /etc/sysupgrade.conf - 备份升级(保留配置)时排除的文件清单
# 逐行列出, 可用通配符。以下均为本固件构建时生成的参数文件, 不属于用户配置:
# 保留它们会让旧固件的构建参数(PPPoE 账号/密码、默认管理 IP)在新固件上继续生效,
# 与用户在 Action UI 里为本版本输入的参数不一致(见防错 #44)。

## 构建参数文件(99-custom.sh 读取, 每次构建重新生成)
/etc/config/pppoe-settings
/etc/config/custom_router_ip.txt

## 首启脚本的调试日志(升级后保留旧日志会造成「首启没跑」的误判, 见防错 #36)
/etc/config/uci-defaults-log.txt
